server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    server_tokens off;

    root /var/www/devops-portfolio/current;
    index index.html;

    # Deployment/uptime health endpoint served directly by Nginx.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Static portfolio. Return 404 for files that do not exist.
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache fingerprint-friendly/static assets. Update extensions as the site grows.
    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Resume should remain viewable inline; the HTML opens it in a new tab.
    location ~* \.pdf$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Disposition "inline";
    }

    # Basic browser hardening that is safe for the current CDN-based portfolio.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Keep portfolio uploads intentionally small.
    client_max_body_size 1m;
}
